<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Torneo de Snake en Vivo 🐍</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <div id="contenedor-lobby" class="pantalla active">
        <div class="tarjeta-lobby">
            <h1>Torneo de Snake</h1>
            <p>Ingresa tu nombre para unirte al servidor con tus compañeros:</p>
            <input type="text" id="txt-username" placeholder="Ej: xd_99" maxlength="15">
            <button id="btn-conectar">Unirse al Torneo</button>
            <p id="lbl-estado" class="estado-espera"></p>
        </div>
    </div>

    <div id="contenedor-juego" class="pantalla">
        <canvas id="canvas-juego" width="400" height="400"></canvas>
        <div style="text-align: center; margin-top: 15px;">
        <button id="btn-volver-lobby" style="display: none; padding: 10px 20px; font-size: 16px; background-color: #2ea44f; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Volver al Lobby
        </button>
    </div>
</div>
    </div>

    <div id="panel-ranking">
        <h3>Tabla de Posiciones</h3>
        <ol id="lista-ranking">
            </ol>
    </div>

    <!-- [AM] Modal que aparece al comer una manzana: hay que responder para ganar el punto -->
    <div id="modal-pregunta" class="modal-overlay">
        <div class="modal-pregunta-caja">
            <h2>❓ ¡Manzana comida!</h2>
            <p id="txt-pregunta-modal">Cargando pregunta...</p>

            <!-- [AM] Botones A/B/C/D para preguntas de opción múltiple -->
            <div id="opciones-pregunta" class="opciones-pregunta"></div>

            <!-- [AM] Input de texto libre, solo se usa si la pregunta NO tiene opciones -->
            <input type="text" id="input-respuesta" placeholder="Escribe tu respuesta" autocomplete="off">

            <div id="timer-pregunta" class="timer-pregunta">⏱️ 5s</div>
            <button id="btn-responder">Responder</button>
            <p id="feedback-pregunta"></p>
        </div>
    </div>

    <script src="js/juego.js"></script>
    <script src="js/red.js"></script>
</body>
</html>
