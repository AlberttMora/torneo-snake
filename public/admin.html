<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Torneo Snake</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1> PANEL DE CONTROL (ADMIN)</h1>
        <hr>
        
        <div class="admin-actions">
            <button id="btn-iniciar" class="btn-primary">INICIAR TORNEO YA!</button>
        </div>

        <!-- [AM] Sección para configurar la pregunta que se muestra al comer manzana -->
        <div class="pregunta-section">
            <h2>❓ Pregunta de la Manzana</h2>
            <label for="txt-pregunta">Pregunta:</label>
            <input type="text" id="txt-pregunta" placeholder="Ej: ¿Cuánto es 5 + 3?">

            <label for="txt-respuesta">Respuesta correcta:</label>
            <input type="text" id="txt-respuesta" placeholder="Ej: 8">

            <label for="txt-tiempo-limite">Tiempo mínimo para responder (segundos):</label>
            <input type="number" id="txt-tiempo-limite" min="1" value="5">

            <button id="btn-actualizar-pregunta" class="btn-primary">Actualizar Pregunta</button>
            <p id="lbl-pregunta-estado"></p>
        </div>

        <div class="lobby-section">
            <h2>👥 Alumnos en el Lobby</h2>
            <ul id="lista-lobby"></ul>
        </div>

        <div class="ranking-section">
            <h2> Tabla de Posiciones en Vivo</h2>
            <table id="tabla-ranking">
                <thead>
                    <tr>
                        <th>Posición</th>
                        <th>Alumno</th>
                        <th>Puntaje</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="cuerpo-tabla"></tbody>
            </table>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const socket = io();
        const btnIniciar = document.getElementById('btn-iniciar');
        const cuerpoTabla = document.getElementById('cuerpo-tabla');

        // [AM] Elementos del formulario de pregunta
        const txtPregunta = document.getElementById('txt-pregunta');
        const txtRespuesta = document.getElementById('txt-respuesta');
        const txtTiempoLimite = document.getElementById('txt-tiempo-limite');
        const btnActualizarPregunta = document.getElementById('btn-actualizar-pregunta');
        const lblPreguntaEstado = document.getElementById('lbl-pregunta-estado');

        // Pestaña de pruebas para verificar si el script vive
        console.log("El script del Admin cargo correctamente en el navegador.");

        if (btnIniciar) {
            btnIniciar.addEventListener('click', () => {
                alert("¡Diste click al botón azul! Enviando señal al servidor...");
                
                socket.emit('admin_iniciar_torneo'); 
            });
        } else {
            alert("Error: No se encontró el botón con ID 'btn-iniciar' en el HTML.");
        }

        // [AM] Al hacer click, mandamos la nueva pregunta al servidor,
        // que la reenvía a todos los jugadores conectados.
        if (btnActualizarPregunta) {
            btnActualizarPregunta.addEventListener('click', () => {
                const pregunta = txtPregunta.value.trim();
                const respuesta = txtRespuesta.value.trim();
                const tiempoLimite = Number(txtTiempoLimite.value) || 5;

                if (pregunta === "" || respuesta === "") {
                    alert("Debes escribir la pregunta y la respuesta correcta.");
                    return;
                }

                socket.emit('admin_set_pregunta', { texto: pregunta, respuesta: respuesta, tiempoLimite: tiempoLimite });

                if (lblPreguntaEstado) {
                    lblPreguntaEstado.textContent = "✅ Pregunta actualizada y enviada a todos los jugadores.";
                    lblPreguntaEstado.style.color = "#2ea44f";
                }
            });
        }

        socket.on('actualizar_ranking', (ranking) => {
            cuerpoTabla.innerHTML = '';
            ranking.forEach((jugador, index) => {
                const fila = document.createElement('tr');
                fila.innerHTML = `
                    <td>#${index + 1}</td>
                    <td><strong>${jugador.username}</strong></td>
                    <td>${jugador.puntos} pts</td>
                    <td>${jugador.vivo ? '🐍 Jugando' : '💀 Game Over'}</td>
                `;
                cuerpoTabla.appendChild(fila);
            });
        });
    });
</script>
</body>
</html>
